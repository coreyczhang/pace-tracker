<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Velocity Pacer</title>
<style>
:root {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --text: #1E293B;
  --muted: #64748B;
  --line: #E2E8F0;
  --accent: #0D9488;
  --accent-dark: #0F766E;
  --accent-soft: #CCFBF1;
  --amber: #D97706;
  --terracotta: #EA580C;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color .6s ease;
}
body[data-view="break"] { background: #F0FDFA; }

.screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}
.panel { width: 100%; max-width: 480px; }
.report { width: 100%; max-width: 680px; }
.focus { text-align: center; width: 100%; max-width: 600px; }

h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
.label { font-size: 14px; color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
.sub { font-size: 14px; color: var(--muted); margin: 0 0 20px; }

.field { margin-bottom: 20px; }
.field > label, .field > .label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 8px;
}
input[type="text"], input[type="number"] {
  width: 100%;
  font: inherit;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  min-height: 44px;
}
input::placeholder { color: #94A3B8; }
.custom-unit { margin-top: 8px; }
input:focus, button:focus-visible {
  outline: 2px solid rgba(79, 70, 229, .35);
  outline-offset: 2px;
}
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  font: inherit;
  font-size: 14px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
  cursor: pointer;
}
.pill[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  margin-bottom: 8px;
  border-top: 1px solid var(--line);
}
.switch-wrap { display: flex; align-items: center; gap: 10px; }
.switch {
  position: relative;
  width: 44px;
  height: 26px;
  border-radius: 999px;
  border: 0;
  background: #CBD5E1;
  cursor: pointer;
  padding: 0;
  transition: background .2s;
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s;
}
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.switch-state { font-size: 14px; color: var(--muted); min-width: 22px; }
.error { color: #B42318; font-size: 14px; min-height: 18px; margin: 0 0 8px; }

.btn {
  display: block;
  width: 100%;
  font: inherit;
  font-weight: 500;
  color: #fff;
  background: var(--accent);
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  min-height: 46px;
  cursor: pointer;
}
.btn:hover { background: var(--accent-dark); }
.btn.outline {
  background: #fff;
  color: var(--accent-dark);
  border: 1px solid var(--accent);
}
.btn.outline:hover { background: var(--accent-soft); }
.btn.big {
  min-height: 110px;
  font-size: 20px;
  border-radius: 16px;
  margin: 28px 0 16px;
}
.btn-inline { font-size: 14px; font-weight: 400; opacity: .9; }

.link {
  background: none;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-size: 14px;
  padding: 8px 10px;
  min-height: 40px;
  cursor: pointer;
  border-radius: 8px;
}
.link:hover { color: var(--text); }
.link:disabled { opacity: .4; cursor: default; }

/* Focus view */
.task { font-size: 14px; color: var(--muted); }
.milestone {
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -.01em;
  margin: 10px 0 0;
}
.treat-badge {
  font-size: 15px;
  font-weight: 500;
  color: var(--terracotta);
  margin: 10px 0 0;
}
.track-wrap { width: 100%; margin-top: 8px; }
.track-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
#trackFill {
  transform-box: fill-box;
  transform-origin: 0% 50%;
  transition: transform .7s ease;
}
#dog { transition: transform .7s cubic-bezier(.3, .7, .3, 1); }
#treatPos, #popPos { transition: none; }

.treat { opacity: 0; }
.treat.drop { animation: drop .4s ease-out forwards; }
.treat.eaten { animation: eat .35s ease-in forwards; }
@keyframes drop {
  from { transform: translateY(-34px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes eat {
  from { transform: scale(1); opacity: 1; }
  to { transform: scale(.2) translateY(-6px); opacity: 0; }
}

.dog-hop.hop { animation: hop .5s ease-out; }
@keyframes hop {
  0%, 100% { transform: translateY(0); }
  40% { transform: translateY(-14px); }
  70% { transform: translateY(0); }
}

.pop-anim { opacity: 0; }
.pop-anim.run { animation: pop 1.1s ease-out forwards; }
@keyframes pop {
  0% { opacity: 0; transform: translateY(6px) scale(.85); }
  20% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-18px); }
}

.banner {
  background: #FFF7ED;
  border: 1px solid #FDBA74;
  border-radius: 14px;
  padding: 16px;
  margin-top: 24px;
  animation: fade .5s ease-out;
}
.banner-title { margin: 0 0 12px; font-size: 18px; font-weight: 600; color: #C2410C; }
.banner-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 24px;
}
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric .value { font-size: 20px; font-weight: 500; }
.bottombar {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-top: 28px;
  flex-wrap: wrap;
}

/* Break view */
.break { text-align: center; width: 100%; max-width: 480px; }
.orb {
  width: 120px;
  height: 120px;
  margin: 0 auto 28px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #CCFBF1, #99F6E4 55%, #5EEAD4);
  opacity: .85;
  animation: breathe 8s ease-in-out infinite;
}
@keyframes breathe { 0%, 100% { transform: scale(.92); } 50% { transform: scale(1.06); } }
.break-total { margin: 24px 0 32px; }
.break-total .value { display: block; font-size: 40px; font-weight: 500; }

/* Researcher report */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin: 20px 0 24px;
}
.card-stat {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.card-stat .big { font-size: 20px; font-weight: 600; }
.card-stat .sub { font-size: 13px; margin: 0; }
.check { margin-bottom: 24px; }
.check input { max-width: 140px; }
.check .sub { margin: 8px 0 0; }
.units {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  margin-bottom: 24px;
}
.units th {
  text-align: left;
  color: var(--muted);
  font-weight: 500;
  padding: 8px 6px;
  border-bottom: 1px solid var(--line);
}
.units td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
.actions { display: flex; flex-direction: column; gap: 8px; }
.toast { min-height: 20px; font-size: 14px; color: var(--accent-dark); margin: 12px 0 0; text-align: center; }

.pulse { animation: pulse .4s ease-out; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(13, 148, 136, .35); }
  100% { box-shadow: 0 0 0 14px rgba(13, 148, 136, 0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 560px) {
  .milestone { font-size: 30px; }
  .metrics { grid-template-columns: 1fr; }
  .banner-actions { grid-template-columns: 1fr; }
}
</style>
</head>
<body data-view="setup">
<main id="app" class="screen"></main>

<script>
'use strict';

/* ---------- helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const ROLLING_WINDOW = 5;   // rolling pace = mean of the last 5 completed units
const TICK_MS = 250;
const DOG_MIN_X = 84;       // dog centre at 0 units
const DOG_MAX_X = 472;      // dog centre at target (next to the doghouse)
const TREAT_OFFSET_X = 36;  // treat sits just ahead of the dog
const REDUCE_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function singularize(w) {
  if (/ies$/i.test(w)) return w.replace(/ies$/i, 'y');
  if (/sses$/i.test(w)) return w.slice(0, -2);
  if (/s$/i.test(w) && !/ss$/i.test(w)) return w.slice(0, -1);
  return w;
}

function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

function fmtDur(ms) {
  if (ms === null || ms === undefined) return '—';
  const s = Math.round(Math.max(0, ms) / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const r = s % 60;
  if (m < 60) return `${m}m ${r}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}

function fmtEta(ms) {
  const min = ms / 60000;
  if (min >= 1) return `~${Math.round(min)} min`;
  return `~${Math.max(1, Math.round(ms / 1000))} sec`;
}

function setText(sel, text) {
  const el = $(sel);
  if (el && el.textContent !== text) el.textContent = text;
}

function pulseEl(el) {
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

// Restart a CSS animation class on an SVG/HTML element.
function restartClass(el, cls) {
  if (!el) return;
  el.classList.remove(cls);
  void el.getBoundingClientRect();
  el.classList.add(cls);
}

// Dog x position (SVG user units) for a progress fraction 0..1.
const dogX = (f) => DOG_MIN_X + Math.min(1, Math.max(0, f)) * (DOG_MAX_X - DOG_MIN_X);

/* ---------- state ---------- */
const S = {
  view: 'setup',                       // setup | active | break | summary
  draft: { task: '', unit: 'Pages', custom: '', target: 10, showPace: true },
  config: null,
  sessionId: '',
  startedAt: 0,                        // epoch ms
  endedAt: 0,
  endReason: null,
  sessionLogs: [],                     // structured telemetry, in memory only
  units: [],                           // {n, durationMs, rollingAvgMs, trigger, windowStartMs, completedElapsedMs}; one per treat
  unitBankedMs: 0,
  segmentStart: null,                  // null while paused on break
  breakStartedAt: null,
  breakTotalMs: 0,
  breakCount: 0,
  undoCount: 0,
  overtime: false,                     // user chose Bonus Treats after reaching the target
  away: false,
  awayStartedAt: 0,
  timeAwayMs: 0,
  tabSwitchCount: 0,
  glanceTimes: [],                     // session-elapsed ms of each return to the tracker
  actualOverride: null,                // researcher's observed unit count
};

const isRunning = () => S.view === 'active' || S.view === 'break';
const elapsed = (now = Date.now()) => now - S.startedAt;
const unitElapsedMs = (now = Date.now()) => S.unitBankedMs + (S.segmentStart !== null ? now - S.segmentStart : 0);
const atTarget = () => S.units.length >= S.config.target;
const canLog = () => S.view === 'active' && (!atTarget() || S.overtime);

function rollingAvgMs() {
  const win = S.units.slice(-ROLLING_WINDOW);
  return win.length ? win.reduce((a, u) => a + u.durationMs, 0) / win.length : null;
}

/* ---------- telemetry ---------- */
function log(event, fields = {}) {
  S.sessionLogs.push({
    event,
    timestamp: new Date().toISOString(),
    elapsedMs: elapsed(),
    ...fields,
  });
}

/* ---------- session actions ---------- */
function readDraft() {
  const t = $('#taskInput');
  const c = $('#customUnit');
  const n = $('#targetInput');
  if (t) S.draft.task = t.value;
  if (c) S.draft.custom = c.value;
  if (n) S.draft.target = n.value;
}

function startFromSetup() {
  readDraft();
  const d = S.draft;
  const task = d.task.trim();
  const unitPlural = d.unit === 'Custom' ? d.custom.trim() : d.unit;
  const target = Number(d.target);
  const errors = [];
  let focusEl = null;
  if (!task) { errors.push('Enter a task name.'); focusEl = $('#taskInput'); }
  if (!unitPlural) { errors.push('Enter a unit name.'); focusEl = focusEl || $('#customUnit'); }
  if (!Number.isInteger(target) || target < 1 || target > 500) {
    errors.push('Target: 1–500.');
    focusEl = focusEl || $('#targetInput');
  }
  $('#setupError').textContent = errors.join(' ');
  if (errors.length) { focusEl?.focus(); return; }

  const now = Date.now();
  S.config = {
    task,
    unitPlural,
    unitSingular: singularize(unitPlural),
    target,
    showPace: d.showPace,
    condition: d.showPace ? 'pace_visible' : 'pace_hidden',
  };
  S.sessionId = `${now.toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  S.startedAt = now;
  S.endedAt = 0;
  S.endReason = null;
  S.sessionLogs = [];
  S.units = [];
  S.unitBankedMs = 0;
  S.segmentStart = now;
  S.breakStartedAt = null;
  S.breakTotalMs = 0;
  S.breakCount = 0;
  S.undoCount = 0;
  S.overtime = false;
  S.away = false;
  S.awayStartedAt = 0;
  S.timeAwayMs = 0;
  S.tabSwitchCount = 0;
  S.glanceTimes = [];
  S.actualOverride = null;
  S.view = 'active';

  log('SESSION_START', {
    sessionId: S.sessionId,
    taskName: task,
    unitType: unitPlural,
    target,
    paceReadoutEnabled: d.showPace,
  });
  render();
}

// trigger: 'spacebar' | 'button_click'
function completeUnit(trigger) {
  if (!canLog()) return;
  const now = Date.now();
  const dur = unitElapsedMs(now);
  const prevEnd = S.units.length ? S.units[S.units.length - 1].completedElapsedMs : 0;
  const unit = {
    n: S.units.length + 1,
    durationMs: dur,
    rollingAvgMs: null,
    trigger,
    windowStartMs: prevEnd,
    completedElapsedMs: elapsed(now),
  };
  S.units.push(unit);
  unit.rollingAvgMs = rollingAvgMs();
  S.unitBankedMs = 0;
  S.segmentStart = now;

  const treatCount = S.units.length;
  const isBonus = treatCount > S.config.target;
  log('UNIT_LOGGED', {
    unitIndex: unit.n,
    unitDurationMs: Math.round(dur),
    rollingAvgPaceMs: unit.rollingAvgMs === null ? null : Math.round(unit.rollingAvgMs),
    trigger,
  });
  log('TREAT_EARNED', { treatCount, unitIndex: unit.n, trigger, isBonus });
  if (treatCount === S.config.target) log('MILESTONE_REACHED', { target: S.config.target, unitIndex: unit.n });

  refreshActive(true);
  celebrate(isBonus);
}

// Dog hops, treat drops and is eaten, "+1 Treat!" pops up.
function celebrate(isBonus) {
  if (REDUCE_MOTION) return;
  restartClass($('#dogHop'), 'hop');
  restartClass($('#treat'), 'drop');
  setTimeout(() => {
    const treat = $('#treat');
    if (!treat) return;
    treat.classList.remove('drop');
    restartClass(treat, 'eaten');
    $('#popText').textContent = isBonus ? '+1 Bonus Treat!' : '+1 Treat!';
    restartClass($('#popAnim'), 'run');
  }, 750);
}

function undoLast() {
  if (S.view !== 'active' || !S.units.length) return;
  const now = Date.now();
  const u = S.units.pop();
  // Return the timer to the undone unit: its duration plus time since it was logged (breaks excluded).
  S.unitBankedMs = u.durationMs + unitElapsedMs(now);
  S.segmentStart = now;
  S.undoCount++;
  log('UNDO_TRIGGERED', { undoneUnitIndex: u.n, undoneUnitDurationMs: Math.round(u.durationMs) });
  log('TREAT_REMOVED', { treatCount: S.units.length, unitIndex: u.n });
  refreshActive();
}

function enterBonus() {
  if (S.view !== 'active' || S.overtime) return;
  S.overtime = true;
  log('BONUS_MODE_STARTED', { treatCount: S.units.length });
  refreshActive();
}

/* Tab/window presence. Window blur/focus and visibilitychange both feed this;
   the S.away flag de-duplicates the overlapping events. */
function setAway(isAway) {
  if (!isRunning() || isAway === S.away) return;
  const now = Date.now();
  if (isAway) {
    S.away = true;
    S.awayStartedAt = now;
    S.tabSwitchCount++;
    log('TAB_BLUR', { unitIndex: S.units.length + 1 });
  } else {
    const d = now - S.awayStartedAt;
    S.away = false;
    S.timeAwayMs += d;
    S.glanceTimes.push(elapsed(now));
    log('TAB_FOCUS', { unitIndex: S.units.length + 1, awayDurationMs: Math.round(d) });
  }
}

function startBreak() {
  if (S.view !== 'active') return;
  const now = Date.now();
  S.unitBankedMs = unitElapsedMs(now);
  S.segmentStart = null;
  S.breakStartedAt = now;
  S.view = 'break';
  log('BREAK_STARTED', { breakIndex: S.breakCount + 1, unitIndex: S.units.length + 1 });
  render();
}

function closeBreak(now, endedBySessionEnd = false) {
  const d = now - S.breakStartedAt;
  S.breakCount++;
  S.breakTotalMs += d;
  S.breakStartedAt = null;
  const fields = { breakIndex: S.breakCount, breakDurationMs: Math.round(d) };
  if (endedBySessionEnd) fields.endedBySessionEnd = true;
  log('BREAK_ENDED', fields);
}

function endBreak() {
  if (S.view !== 'break') return;
  const now = Date.now();
  closeBreak(now);
  S.segmentStart = now;
  S.view = 'active';
  render();
}

function toggleBreak() {
  if (S.view === 'active') startBreak();
  else if (S.view === 'break') endBreak();
}

function endSession(reason) {
  if (!isRunning()) return;
  const now = Date.now();
  const partial = unitElapsedMs(now);
  if (S.view === 'break') closeBreak(now, true);
  if (S.away) {
    const d = now - S.awayStartedAt;
    S.away = false;
    S.timeAwayMs += d;   // not counted as a glance: the session ended while away
    log('TAB_FOCUS', { unitIndex: S.units.length + 1, awayDurationMs: Math.round(d), endedBySessionEnd: true });
  }
  S.unitBankedMs = 0;
  S.segmentStart = null;
  S.endedAt = now;
  S.endReason = reason;
  S.view = 'summary';
  log('SESSION_ENDED', {
    reason,
    unitsLogged: S.units.length,
    treatsEarned: S.units.length,
    partialUnitMs: Math.round(partial),
  });
  render();
}

let endArmedTimer = null;
function confirmEnd(el) {
  if (!el.dataset.armed) {
    el.dataset.armed = '1';
    el.textContent = 'Confirm end';
    clearTimeout(endArmedTimer);
    endArmedTimer = setTimeout(() => {
      delete el.dataset.armed;
      el.textContent = 'End Session';
    }, 3000);
    return;
  }
  clearTimeout(endArmedTimer);
  endSession('manual');
}

function setUnit(u) {
  readDraft();
  S.draft.unit = u;
  document.querySelectorAll('.pill').forEach((p) => p.setAttribute('aria-pressed', String(p.dataset.unit === u)));
  const custom = $('#customUnit');
  custom.hidden = u !== 'Custom';
  if (u === 'Custom') custom.focus();
}

function togglePace(el) {
  S.draft.showPace = !S.draft.showPace;
  el.setAttribute('aria-checked', String(S.draft.showPace));
  el.parentElement.querySelector('.switch-state').textContent = S.draft.showPace ? 'On' : 'Off';
}

/* ---------- report computations ---------- */
function glancesIn(u) {
  return S.glanceTimes.filter((t) => t > u.windowStartMs && t <= u.completedElapsedMs).length;
}

function buildReport() {
  const logged = S.units.length;
  const durs = S.units.map((u) => u.durationMs);
  const avg = logged ? durs.reduce((a, b) => a + b, 0) / logged : null;
  const sd = logged ? Math.sqrt(durs.reduce((a, x) => a + (x - avg) ** 2, 0) / logged) : null;
  let fast = null;
  let slow = null;
  for (const u of S.units) {
    if (!fast || u.durationMs < fast.durationMs) fast = u;
    if (!slow || u.durationMs > slow.durationMs) slow = u;
  }
  const spacebar = S.units.filter((u) => u.trigger === 'spacebar').length;
  const actual = S.actualOverride ?? logged;
  const missed = Math.max(0, actual - logged);
  // Clamped to 100 when the researcher's count is below the logged total.
  const compliance = actual > 0 ? Math.min(100, Math.round((logged / actual) * 100)) : null;
  const lengthMs = S.endedAt - S.startedAt;
  return {
    logged,
    actual,
    missed,
    compliance,
    avg,
    sd,
    fast,
    slow,
    treats: logged,
    bonus: Math.max(0, logged - S.config.target),
    home: logged >= S.config.target,
    spacebarPct: logged ? Math.round((spacebar / logged) * 100) : null,
    clickPct: logged ? Math.round(((logged - spacebar) / logged) * 100) : null,
    glances: S.glanceTimes.length,
    tabSwitches: S.tabSwitchCount,
    awayMs: S.timeAwayMs,
    lookingMs: Math.max(0, lengthMs - S.timeAwayMs),
    lengthMs,
    breakCount: S.breakCount,
    breakMs: S.breakTotalMs,
  };
}

/* ---------- report exports ---------- */
function slideSummaryText() {
  const c = S.config;
  const rp = buildReport();
  const sing = c.unitSingular.toLowerCase();
  const plural = c.unitPlural.toLowerCase();
  const taps = rp.missed === 1 ? 'tap' : 'taps';
  return [
    `${c.task}: Milestone Velocity Pacer`,
    `Logged ${rp.logged} of ${rp.actual} ${plural} actually completed (${rp.missed} missed ${taps}; tap compliance ${rp.compliance === null ? '—' : `${rp.compliance}%`})`,
    `Treats earned: ${rp.treats} (${rp.bonus} bonus) · Home safe: ${rp.home ? 'yes' : 'no'}`,
    `Tab switches: ${rp.tabSwitches} · glances back: ${rp.glances} · on tracker ${fmtDur(rp.lookingMs)} · away ${fmtDur(rp.awayMs)}`,
    `Average pace: ${rp.avg === null ? '—' : `${fmtDur(rp.avg)} per ${sing}`}${rp.sd === null ? '' : ` (σ ${fmtDur(rp.sd)})`}`,
    `Fastest: ${rp.fast ? `${sing} ${rp.fast.n} (${fmtDur(rp.fast.durationMs)})` : '—'} · Slowest: ${rp.slow ? `${sing} ${rp.slow.n} (${fmtDur(rp.slow.durationMs)})` : '—'}`,
    `Input: ${rp.spacebarPct === null ? '—' : `${rp.spacebarPct}% spacebar, ${rp.clickPct}% button click`}`,
    `Breaks: ${rp.breakCount} (${fmtDur(rp.breakMs)}) · Session length ${fmtDur(rp.lengthMs)} · Live pace readout ${c.showPace ? 'On' : 'Off'}`,
  ].join('\n');
}

function buildJSON() {
  const c = S.config;
  const rp = buildReport();
  const pick = (u) => (u ? { unitIndex: u.n, durationMs: Math.round(u.durationMs) } : null);
  return JSON.stringify({
    schema: 'pace-tracker-log/v3',
    sessionId: S.sessionId,
    config: {
      taskName: c.task,
      unitType: c.unitPlural,
      target: c.target,
      paceReadoutEnabled: c.showPace,
      condition: c.condition,
    },
    startedAt: new Date(S.startedAt).toISOString(),
    endedAt: new Date(S.endedAt).toISOString(),
    endReason: S.endReason,
    researcherCheck: {
      loggedUnits: rp.logged,
      actualUnits: rp.actual,
      missedTaps: rp.missed,
      tapComplianceRate: rp.compliance,
    },
    treats: {
      treatsEarned: rp.treats,
      bonusTreats: rp.bonus,
      homeSafe: rp.home,
    },
    summary: {
      averagePaceMs: rp.avg === null ? null : Math.round(rp.avg),
      paceStdDevMs: rp.sd === null ? null : Math.round(rp.sd),
      fastestUnit: pick(rp.fast),
      slowestUnit: pick(rp.slow),
      inputMethod: {
        spacebarUnits: S.units.filter((u) => u.trigger === 'spacebar').length,
        buttonClickUnits: S.units.filter((u) => u.trigger === 'button_click').length,
      },
      tabSwitchCount: rp.tabSwitches,
      glanceCount: rp.glances,
      timeOnTrackerMs: Math.round(rp.lookingMs),
      timeAwayMs: Math.round(rp.awayMs),
      breakCount: rp.breakCount,
      totalBreakMs: Math.round(rp.breakMs),
      sessionLengthMs: rp.lengthMs,
    },
    units: S.units.map((u) => ({
      unitIndex: u.n,
      durationMs: Math.round(u.durationMs),
      rollingAvgPaceMs: u.rollingAvgMs === null ? null : Math.round(u.rollingAvgMs),
      trigger: u.trigger,
      glances: glancesIn(u),
    })),
    sessionLogs: S.sessionLogs,
  }, null, 2);
}

function download(filename, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadLog() {
  const stamp = new Date(S.startedAt).toISOString().replace(/[:.]/g, '-');
  download(`pace-tracker-log-${stamp}.json`, buildJSON(), 'application/json');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
    return ok;
  }
}

async function copySlideSummary(el) {
  const ok = await copyText(slideSummaryText());
  el.textContent = ok ? 'Copied' : 'Copy failed';
  setTimeout(() => { el.textContent = 'Copy Slide Summary'; }, 1800);
}

function activeHTML() {
  const c = S.config;
  return `
  <section class="focus" aria-label="Session">

    <h1 class="milestone" id="milestone" aria-live="polite"></h1>

let tailDur = '1.8s';
function setDogSpeed(dur) {
  const tail = $('#tailAnim');
  if (!tail || dur === tailDur) return;
  tailDur = dur;
  tail.setAttribute('dur', dur);
}

function refreshActive(pulse = false) {
  const c = S.config;
  const done = S.units.length;
  const home = done >= c.target;
  const showBanner = home && !S.overtime;
  const f = Math.min(1, done / c.target);
  const bonus = Math.max(0, done - c.target);
  const plural = c.unitPlural.toLowerCase();

  setText('#milestone', showBanner
    ? `All ${c.target} ${plural} done`
    : home
      ? `Bonus treat ${bonus + 1}`
      : `${cap(c.unitSingular)} ${done + 1} of ${c.target}`);

  setText('#treatBadge', `🦴 ${bonus > 0 ? `${done} Treats Earned · ${bonus} bonus` : `${done} / ${c.target} Treats Earned`}`);

  // Track, dog, treat and pop are all positioned from the same progress fraction.
  $('#trackFill').style.transform = `scaleX(${f})`;
  $('#dog').style.transform = `translateX(${dogX(f)}px)`;
  $('#treatPos').style.transform = `translateX(${dogX(f) + TREAT_OFFSET_X}px)`;
  $('#popPos').style.transform = `translateX(${dogX(f)}px)`;
  setDogSpeed(home ? '0.6s' : '1.8s');

  $('#homeBanner').hidden = !showBanner;
  $('#primaryBtn').hidden = showBanner;
  $('#undoBtn').disabled = done === 0;

  if (c.showPace) {
    const avg = rollingAvgMs();
    const rem = c.target - done;
    setText('#unitElapsed', fmtClock(unitElapsedMs()));
    setText('#avgPace', avg === null ? '—' : fmtDur(avg));
    setText('#eta', rem > 0 && avg !== null ? fmtEta(avg * rem) : rem > 0 ? '—' : 'Home');
  }

  if (pulse) {
    pulseEl($('#primaryBtn'));
    pulseEl($('#milestone'));
  }
}

function breakHTML() {
  return `
  <section class="break" aria-live="polite">
    <div class="orb" aria-hidden="true"></div>
    <h1>Break</h1>
    <div class="break-total">
      <span class="value mono" id="breakTotal">00:00</span>
    </div>
    <button type="button" class="btn" data-action="resume">Resume</button>
    <p><button type="button" class="link" data-action="end">End Session</button></p>
  </section>`;
}

function refreshBreak() {
  const live = S.breakStartedAt ? Date.now() - S.breakStartedAt : 0;
  setText('#breakTotal', fmtClock(S.breakTotalMs + live));
}

function cardsHTML(rp) {
  const sing = S.config.unitSingular.toLowerCase();
  const plural = S.config.unitPlural.toLowerCase();
  const taps = rp.missed === 1 ? 'tap' : 'taps';
  const card = (label, big, sub) =>
    `<div class="card-stat"><span class="label">${label}</span><span class="big">${big}</span><span class="sub">${sub}</span></div>`;
  return [
    card('Logged vs actual',
      `${rp.logged} / ${rp.actual} ${plural}`,
      `${rp.missed} missed ${taps}${rp.compliance === null ? '' : ` · ${rp.compliance}% compliance`}`),
    card('Treats earned',
      `${rp.treats}`,
      `${rp.bonus} bonus · ${rp.home ? 'home safe' : 'not yet home'}`),
    card('Tracker glances',
      `${rp.glances} back`,
      `on tracker ${fmtDur(rp.lookingMs)} · away ${fmtDur(rp.awayMs)}`),
    card('Average pace',
      rp.avg === null ? '—' : `${fmtDur(rp.avg)} / ${sing}`,
      rp.avg === null ? '' : `σ ${fmtDur(rp.sd)} · fastest ${fmtDur(rp.fast.durationMs)} · slowest ${fmtDur(rp.slow.durationMs)}`),
    card('Input method',
      rp.spacebarPct === null ? '—' : `${rp.spacebarPct}% spacebar`,
      rp.spacebarPct === null ? '' : `${rp.clickPct}% button click`),
  ].join('');
}

function checkNoteText(rp) {
  const parts = [];
  if (rp.slow) {
    parts.push(`Longest delay: ${cap(S.config.unitSingular.toLowerCase())} ${rp.slow.n} (${fmtDur(rp.slow.durationMs)})${rp.missed > 0 ? ', the likeliest spot for a missed tap.' : '.'}`);
  }
  if (rp.actual < rp.logged) parts.push('Researcher count is below the logged total.');
  return parts.join(' ');
}

function unitsTableHTML() {
  if (!S.units.length) return '<p class="sub">No units logged.</p>';
  const sing = cap(S.config.unitSingular.toLowerCase());
  const rows = S.units.map((u) => `
      <tr>
        <td>${sing} ${u.n}</td>
        <td>${fmtDur(u.durationMs)}</td>
        <td>${fmtDur(u.rollingAvgMs)}</td>
        <td>${glancesIn(u)}</td>
      </tr>`).join('');
  return `
  <table class="units">
    <thead><tr><th>Unit</th><th>Time spent</th><th>Rolling avg</th><th>Glances</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function reportHTML() {
  const c = S.config;
  const rp = buildReport();
  const plural = c.unitPlural.toLowerCase();
  const status = rp.home
    ? `Home safe: all ${c.target} ${plural} logged${rp.bonus ? `, plus ${rp.bonus} bonus` : ''}.`
    : `Ended at ${rp.logged} of ${c.target} ${plural}.`;
  return `
  <section class="report" aria-labelledby="repTitle">
    <h1 id="repTitle">${esc(c.task)}</h1>
    <p class="sub">${esc(status)}</p>
    <div class="cards" id="cards">${cardsHTML(rp)}</div>
    <div class="check">
      <label for="actualInput" class="label">Researcher check: actual units completed</label>
      <div><input id="actualInput" type="number" inputmode="numeric" min="0" max="999" step="1" value="${rp.actual}"></div>
      <p class="sub" id="checkNote">${esc(checkNoteText(rp))}</p>
    </div>
    <h2>Unit breakdown</h2>
    ${unitsTableHTML()}
    <div class="actions">
      <button type="button" class="btn outline" data-action="copy">Copy Slide Summary</button>
      <button type="button" class="btn outline" data-action="download">Download Full JSON/CSV Log</button>
      <button type="button" class="link" data-action="new">New session</button>
    </div>
  </section>`;
}

const VIEWS = { setup: setupHTML, active: activeHTML, break: breakHTML, summary: reportHTML };

function render() {
  document.body.dataset.view = S.view;
  $('#app').innerHTML = VIEWS[S.view]();
  if (S.view === 'active') {
    if (REDUCE_MOTION) document.querySelectorAll('#app animateTransform').forEach((n) => n.remove());
    refreshActive();
  }
  if (S.view === 'break') refreshBreak();
  if (S.view === 'setup' && !S.draft.task) $('#taskInput')?.focus();
}

/* ---------- events ---------- */
$('#app').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action], [data-unit]');
  if (!el || el.disabled) return;
  if (el.dataset.unit) return setUnit(el.dataset.unit);
  switch (el.dataset.action) {
    case 'primary': return completeUnit('button_click');
    case 'undo': return undoLast();
    case 'break': return toggleBreak();
    case 'resume': return endBreak();
    case 'end': return confirmEnd(el);
    case 'end-home': return endSession('target_reached');
    case 'bonus': return enterBonus();
    case 'toggle-pace': return togglePace(el);
    case 'copy': return copySlideSummary(el);
    case 'download': return downloadLog();
    case 'new':
      S.view = 'setup';
      return render();
  }
});

// Researcher check: live recompute of the cards and note as the count changes.
$('#app').addEventListener('input', (e) => {
  if (e.target.id !== 'actualInput') return;
  const n = Number.parseInt(e.target.value, 10);
  S.actualOverride = Number.isFinite(n) && n >= 0 ? n : null;
  const rp = buildReport();
  $('#cards').innerHTML = cardsHTML(rp);
  $('#checkNote').textContent = checkNoteText(rp);
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'setupForm') {
    e.preventDefault();
    startFromSetup();
  }
});

const isSpace = (e) => e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar';
const isTyping = (t) => t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]');

document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!isRunning() || isTyping(e.target)) return;
  if (isSpace(e)) {
    e.preventDefault();               // stops a focused button from also firing a click
    if (!e.repeat) completeUnit('spacebar');
    return;
  }
  if ((e.key === 'p' || e.key === 'P') && !e.repeat) {
    e.preventDefault();
    toggleBreak();
  }
});

document.addEventListener('keyup', (e) => {
  if (isSpace(e) && isRunning() && !isTyping(e.target)) e.preventDefault();
});

// Tab/window presence: blur/focus on the window and visibilitychange.
window.addEventListener('blur', () => setAway(true));
window.addEventListener('focus', () => setAway(false));
document.addEventListener('visibilitychange', () => setAway(document.visibilityState === 'hidden'));

setInterval(() => {
  if (S.view === 'active') refreshActive();
  else if (S.view === 'break') refreshBreak();
}, TICK_MS);

render();
</script>
</body>
</html>
